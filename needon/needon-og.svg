<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2D1B69"/>
      <stop offset="1" stop-color="#0F0A2A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5722"/>
      <stop offset="1" stop-color="#FF8A50"/>
    </linearGradient>
  </defs>
  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 장식 원 -->
  <circle cx="1100" cy="80" r="220" fill="rgba(255,255,255,0.03)"/>
  <circle cx="100" cy="560" r="180" fill="rgba(255,87,34,0.06)"/>

  <!-- 아이콘 (200×200, 중앙 상단) -->
  <g transform="translate(500 90) scale(0.39)">
    <rect width="512" height="512" rx="114" fill="rgba(255,255,255,0.07)"/>
    <rect x="43" y="114" width="50" height="284" fill="#FF5722"/>
    <polygon points="93,114 143,114 200,398 150,398" fill="#FF5722"/>
    <rect x="193" y="114" width="50" height="284" fill="#FF5722"/>
    <path fill-rule="evenodd" fill="white"
      d="M270 114 L313 114 Q484 114 484 256 Q484 398 313 398 L270 398 Z
         M313 171 Q427 171 427 256 Q427 341 313 341 Z"/>
  </g>

  <!-- NeeDON 텍스트 -->
  <text x="600" y="390" font-family="Arial Black,sans-serif" font-weight="900"
    font-size="110" fill="white" text-anchor="middle" letter-spacing="-2">NeeDON</text>

  <!-- 태그라인 -->
  <text x="600" y="452" font-family="Arial,sans-serif" font-size="34"
    fill="rgba(255,255,255,0.55)" text-anchor="middle">내 떼인 돈, 내가 찾는다</text>

  <!-- 하단 기능 설명 -->
  <rect x="300" y="490" width="600" height="2" rx="1" fill="rgba(255,87,34,0.4)"/>
  <text x="600" y="535" font-family="Arial,sans-serif" font-size="26"
    fill="#FF8A50" text-anchor="middle">주휴수당 · 야간수당 · 3.3% 원천세 자동 계산</text>
</svg>
