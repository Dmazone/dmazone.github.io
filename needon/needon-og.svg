<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2D1B69"/>
      <stop offset="1" stop-color="#0F0A2A"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5722"/>
      <stop offset="1" stop-color="#FF8A50"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 장식 원 -->
  <circle cx="1120" cy="60" r="300" fill="rgba(255,255,255,0.025)"/>
  <circle cx="80"   cy="590" r="220" fill="rgba(255,87,34,0.07)"/>

  <!-- 무료 뱃지 -->
  <rect x="80" y="62" width="130" height="46" rx="23" fill="url(#orange)"/>
  <text x="145" y="94" font-family="Arial,sans-serif" font-weight="800" font-size="24" fill="white" text-anchor="middle">무 료</text>

  <!-- 메인 헤드라인 -->
  <text x="80" y="210" font-family="Arial Black,sans-serif" font-weight="900" font-size="88" fill="white">알바비 떼였나요?</text>

  <!-- 서브 헤드라인 (오렌지) -->
  <text x="80" y="302" font-family="Arial Black,sans-serif" font-weight="900" font-size="72" fill="#FF5722">3년치 역산 가능합니다</text>

  <!-- 기능 요약 -->
  <text x="80" y="370" font-family="Arial,sans-serif" font-size="36" fill="rgba(255,255,255,0.70)">주휴수당 · 야간수당 · 3.3% 원천세 자동 계산</text>
  <text x="80" y="418" font-family="Arial,sans-serif" font-size="36" fill="rgba(255,255,255,0.70)">출퇴근 기록 입력 → 노동청 정산서 30초 완성</text>

  <!-- 구분선 -->
  <rect x="80" y="450" width="480" height="2" rx="1" fill="rgba(255,87,34,0.45)"/>

  <!-- URL -->
  <text x="80" y="492" font-family="Arial,sans-serif" font-size="28" fill="rgba(255,255,255,0.38)">dmazone.github.io/needon</text>

  <!-- 우측 로고 영역 -->
  <g transform="translate(820 100) scale(0.68)">
    <rect width="512" height="512" rx="114" fill="rgba(255,255,255,0.07)"/>
    <rect x="43"  y="114" width="50" height="284" fill="#FF5722"/>
    <polygon points="93,114 143,114 200,398 150,398" fill="#FF5722"/>
    <rect x="193" y="114" width="50" height="284" fill="#FF5722"/>
    <path fill-rule="evenodd" fill="white"
      d="M270 114 L313 114 Q484 114 484 256 Q484 398 313 398 L270 398 Z
         M313 171 Q427 171 427 256 Q427 341 313 341 Z"/>
  </g>
  <text x="1068" y="514" font-family="Arial Black,sans-serif" font-weight="900" font-size="90" fill="white" text-anchor="middle">니돈</text>
  <text x="1068" y="560" font-family="Arial,sans-serif" font-size="32" fill="rgba(255,255,255,0.45)" text-anchor="middle">NeeDON</text>
